name: Build browser edition for Vercel
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install 'pygbag>=0.9,<1.0'
      - name: Build web files
        run: bash scripts/build_web.sh
      - name: Publish static web folder to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update browser build [skip ci]'
            git push
          fi
